title: EchoStreams
tagline: "OEM/ODM Server & Storage Solutions"
description: "OEM/ODM server and storage systems: flash, high availability, high density, general purpose and GPU servers on Intel Xeon and AMD EPYC."
og_image: /assets/img/og-default.png
# For a project page (https://USER.github.io/REPO) set baseurl: "/REPO". Leave "" for a user/custom-domain site.
url: "https://echostreams.com"
baseurl: ""

collections:
  products:
    output: true
    permalink: /products/:name/

defaults:
  - scope: { path: "", type: products }
    values: { layout: product, bootstrap5: true }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - "*.csv"
